nlGuideQuickInstructions=要使用套牌导入器，只需要输入/粘贴你想要导入的套牌列表中的卡牌名称（每行一个卡牌名称）。套牌列表可以只包含几张备牌，也可以是某个赛制的完整套牌列表\n卡牌列表的每一行都会被处理，其中任何一个能识别的条目都会在套牌列表中以颜色：{0}显示。
lblGuideImportCard=成功识别卡牌并已可以导入。
lblGuideWarnMessage=未知或受限制的牌（例如禁牌或限牌），或一般警告信息。
lblGuideNoImportCard=无效或不被支持的牌无法被导入。
nlGuideTipsTitle=导入选项与自定义
nlGuideTipsText=若要了解套牌导入器可如何整理和优化牌表，请阅读本节。\n{0}
lblGuideTipsTitleCount=卡牌数量
lblGuideTipsCount={0}：在每行牌名之前填写要导入的数量（默认为1）。\n例如，{1}和{2}都是可接受的数量格式。
lblGuideTipsTitleSet=卡图
lblGuideTipsSet={0}：在牌面之前或牌名之后填写万智牌系列代码，以指定卡图。如果同一张牌在该系列中有多幅卡图，还需在行尾填写画家姓名或插画编号（参见下方示例）。
lblGuideTipsTitleFoil=闪卡
lblGuideTipsFoil={0}：牌名以“+”结尾时会导入闪卡版本，例如{1}。也可以在该行末尾添加{2}符号；部分万智牌牌表格式惯用这种写法（参见下方示例）。
lblGuideTipsTitlePlaceholder=分组占位符
lblGuideTipsPlaceholder={0}：可以使用特殊占位符来整理牌表，包括牌张类别（{1}）、稀有度（{2}）、法术力费用（{3}）和法术力颜色（{4}）。
lblGuideTipsTitleDeckSections=套牌小节
lblGuideTipsDeckSection={0}：与分组占位符类似，卡牌列表也可以按套牌分区组织（例如{1}）。导入器会据此将卡牌分配到相应分区（默认：{2}），并自动验证这些分区中的卡牌，以降低导入错误牌表的风险。
lblGuideTipsTitleDeckName=套牌名称
lblGuideTipsDeckName={0}：为套牌命名。输入“Deck:”或“Name:”，后接套牌名称即可。
lblGuideTipsTitleDeckFormat=套牌格式
lblGuideTipsDeckFormats={0}：支持多种万智牌牌表格式，包括MTG Arena、MTGO、XMage、MTG Goldfish、TappedOut（CSV）、DeckStats.net和 .dec文件。
nlGuideExamplesTitle=示例
lblExample1=10x Islands+ MIR 2
nlExample1=10张来自“海市蜃楼”系列、插画编号为2的闪卡“海岛”。
lblExample2=4 Darksteel Citadel (M15) 242
nlExample2=4张来自“2015核心系列”系列、收集编号为“242”的“玄铁殿堂”。\n\n这是TappedOut导出的MTG Arena牌表格式示例。
lblExample3=18 Forest &lt;254&gt; [THB] (F)
nlExample3=18张来自“塞洛斯：冥途求生”系列、收集编号为“254”的闪卡“树林”。\n\n这是由MTGGoldfish导出的MTG Arena牌表格式示例。行尾的“(F)”表示闪卡，尖括号中的收集编号用于指定卡图版本。
lblExample4=4x TMP|Counterspell
nlExample4=4张来自“暴风雨”系列的“反击咒语”。\n\n此行使用可选的竖线分隔符，在牌名前指定系列代码；也可以使用大括号、中括号或圆括号作为系列代码的分隔符。
lblExample5=SB: 2 [M19:28] Mighty Leap
nlExample5=将2张来自“2019核心系列”系列、收集编号为“28”的“大步飞跃”加入备牌。\n\n这是XMage牌表格式示例：系列代码与收集编号以冒号分隔，并写在牌名前的中括号中。可选前缀（如SB:）用于指定套牌分区；Forge套牌导入器还支持MB: 和CM:，分别表示主牌和指挥官分区。
